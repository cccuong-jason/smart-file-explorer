name: Test, Build, and Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - revamp/**
      - feat/**
      - feature/**
      - fix/**
  workflow_dispatch:

concurrency:
  group: test-build-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22

jobs:
  quality:
    name: Typecheck, lint, and unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run coverage suite
        run: npm run test:coverage

      - name: Run regression suite
        run: npm run test:regression

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  ui-smoke:
    name: Browser UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI smoke tests
        run: npm run test:ui

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  desktop-smoke:
    name: Desktop Rust smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run desktop smoke tests
        run: npm run test:desktop

  desktop-package:
    name: Desktop package (${{ matrix.platform.name }})
    needs:
      - quality
      - ui-smoke
      - desktop-smoke
      - security
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows
            runner: windows-latest
          - name: macos
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build desktop bundle
        run: npm run desktop:bundle
        env:
          SMART_FILE_EXPLORER_BUNDLE_ARTIFACT_DIR: artifacts/desktop/${{ matrix.platform.name }}

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: smart-file-explorer-${{ matrix.platform.name }}
          path: artifacts/desktop/${{ matrix.platform.name }}
          if-no-files-found: error
          retention-days: 14

  security:
    name: Dependency and code security
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
